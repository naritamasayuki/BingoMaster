included:
  - BingoMaster
  - BingoMasterTests

disabled_rules:
  - line_length
  - type_body_length
  - file_length
  - function_body_length
  - cyclomatic_complexity
  - identifier_name
  - trailing_comma
  - opening_brace
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - empty_count
  - force_unwrapping

force_cast: error
force_try: error
force_unwrapping:
  severity: warning

excluded:
  - BingoMasterTests

name: CodeQL セキュリティ脆弱性スキャン

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: CodeQL 解析 (Swift)
    runs-on: macos-14
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: CodeQL の初期化
        uses: github/codeql-action/init@v3
        with:
          languages: swift

      - name: CodeQL 解析用ビルドの実行
        run: |
          xcodebuild build \
            -project BingoMaster.xcodeproj \
            -scheme BingoMaster \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: CodeQL セキュリティ解析の実行
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"
